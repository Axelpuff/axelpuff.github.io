---
layout: default
---
<div class="post-page">
  <header class="post-header">
    <nav class="site-nav site-nav--horizontal" aria-label="Primary">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Portfolio</a></li>
        <li class="site-nav__diamond" aria-hidden="true"></li>
        <li><a href="{{ '/writing/' | relative_url }}">Writing</a></li>
        <li class="site-nav__diamond" aria-hidden="true"></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
    </nav>
    
    <a class="post-header__logo-link" href="{{ '/' | relative_url }}" aria-label="Home">
      <div class="site-logo" aria-hidden="true">
        <img src="{{ '/assets/axel_logo.svg' | relative_url }}" alt="" />
      </div>
    </a>
  </header>

  <article class="post-article">
    <h1 class="post-article__title">{{ page.title }}</h1>
    <time class="post-article__date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
    <div class="post-article__content">
      {{ content }}
    </div>
  </article>
</div>

{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('.post-article__content'), {
    delimiters: [
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false }
    ]
  });"></script>
{% endif %}
